services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: utilityos
      POSTGRES_PASSWORD: utilityos
      POSTGRES_DB: utilityos_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "utilityos", "-d", "utilityos_dev"]
      interval: 5s
      retries: 5

volumes:
  pgdata:
